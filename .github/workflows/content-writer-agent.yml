name: "Agent: Content Writer (weekly)"

# ============================================================
# THE SCHEDULE LIVES HERE AND NOWHERE ELSE.
#
# Wednesday, 12:00 UTC (8:00am ET). Wednesday on purpose: the Site
# Auditor files its weekly report Monday morning, and a draft post
# landing on top of that report is a draft nobody reads.
#
# The blog is new and empty, so the cadence starts WEEKLY. It is
# expected to drop to monthly once there is a back catalog. When that
# day comes, change the one cron line below and nothing else.
#
#   weekly   0 12 * * 3     every Wednesday
#   monthly  0 12 1 * *     the 1st of the month, any weekday
#
# Do NOT try to write "the first Wednesday of the month" as
# `0 12 1-7 * 3`. Cron ORs day-of-month against day-of-week when both
# are restricted, so that expression fires on the 1st through the 7th
# AND on every Wednesday, which is more often than weekly, not less.
#
# The agent's own skip rule is the other half of the cadence: a week
# with no strong topic produces an issue and no post. Frequency is the
# ceiling, not the target.
# ============================================================
on:
  schedule:
    - cron: "0 12 * * 3"
  workflow_dispatch:        # the manual "Run workflow" button
    inputs:
      force_draft:
        description: "Test the write path: draft the best available topic even if the skip rule would skip. The PR is titled TEST and is meant to be closed, not merged."
        type: boolean
        default: false

# contents: write and pull-requests: write are a first for this repo. The
# other two agents only ever file issues. This one has to push a branch
# and open a pull request, so it needs both, and nothing beyond them.
#
# issues: write is here for the SKIP path, not as an extra. A week with no
# strong topic files a short `content-skipped` issue and opens no pull
# request; without this permission the agent's correct quiet outcome would
# fail instead of being recorded.
#
# WHAT THIS STILL DOES NOT GET: no packages, no deployments, no actions,
# no secrets beyond the one API key below.
#
# WORTH KNOWING: `contents: write` is repository-wide. It is the agent's
# instructions, not the token, that keep it off main. If you want that
# enforced by the platform rather than by a job description, put branch
# protection on main requiring a pull request. That is the real guard.
permissions:
  contents: write
  pull-requests: write
  issues: write
  id-token: write

jobs:
  write:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0        # the agent reads the blog's history to avoid repeating itself

      - name: Note when this run started
        id: start
        run: echo "at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Give the agent a git identity
        run: |
          git config user.name "Content Writer Agent"
          git config user.email "greg@corcoranpr.com"

      # THE TOOL LIST IS THE PERMISSION BOUNDARY, and it is deliberately
      # verb by verb rather than `Bash(git:*)` and `Bash(gh:*)`.
      #   - `git push` is allowed ONLY for a ref starting `post/`, so the
      #     agent cannot push main even if something told it to. Branch
      #     protection is the second lock; this is the first.
      #   - `git checkout -b` only, not bare `checkout`.
      #   - the gh verbs are the five it uses plus the two label verbs it
      #     needs the first time it ever skips. No delete, no merge, no
      #     `pr merge`, no `api`.
      #   - no rm, no mv, no sed, no curl, no chmod, and no force anything.
      # THE LIST AND THE JOB DESCRIPTION MUST AGREE. The first manual run
      # failed with 8 permission denials because step 8 said "copy the
      # template" while the list had no `cp`. If you add an instruction
      # that needs a command, add the command here in the same commit.
      - name: Claude drafts one post and opens a pull request
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          # Full agent output in the log. It is off by default and that
          # cost us a run: the first forced draft did ten minutes of work,
          # produced nothing, and the log said only "full output hidden
          # for security", so which commands were refused and why it
          # stopped were simply not in the record. This repo is public and
          # its logs already are; the prompt carries no secrets and the
          # agent reads files anyone can read. Being able to diagnose a
          # bad run is worth more than hiding a transcript of public
          # files.
          show_full_output: true
          prompt: |
            Read the file agents/content-writer.md and follow those
            instructions exactly. Today is a scheduled weekly run.

            Two things that are not negotiable, restated here so they are
            in front of you before you start:
            NEVER commit to main. NEVER merge your own pull request.
            Greg's Merge click is the only publish button.

            If there is no strong topic this week, file the
            `content-skipped` issue and open no pull request. That is a
            correct outcome, not a failure.

            FORCE DRAFT: ${{ inputs.force_draft || 'false' }}
            When that says true, this is a test of the write path. The
            skip rule is suspended for this run only: draft your best
            available topic and open the pull request even if you would
            otherwise skip. Follow the "Test runs" section of
            agents/content-writer.md exactly, including the TEST title.
          claude_args: |
            # A hard ceiling on one run. The forced-draft test spent 57
            # turns and $3.60 producing nothing; without a cap a run that
            # is thrashing just keeps paying. Hitting this cap is NOT a
            # success: the agent stops mid-task, so no artifact is
            # created, and the verification step below turns that into a
            # failed job instead of a green one.
            --max-turns 60
            --allowedTools "Read,Grep,Glob,Write,Edit,Bash(mkdir:*),Bash(cp:*),Bash(git status:*),Bash(git diff:*),Bash(git log:*),Bash(git branch:*),Bash(git checkout -b:*),Bash(git add:*),Bash(git commit:*),Bash(git push -u origin post/:*),Bash(gh pr list:*),Bash(gh pr create:*),Bash(gh issue list:*),Bash(gh issue view:*),Bash(gh issue create:*),Bash(gh label list:*),Bash(gh label create:*),Bash(python3 scripts/audit.py:*),Bash(python3 scripts/test-sitemap-expansion.py:*),Bash(python3 -c:*),Bash(wc:*),Bash(date:*)"
        env:
          GH_TOKEN: ${{ github.token }}

      # NOTHING MAY REPORT SUCCESS WHILE PRODUCING NOTHING.
      # The forced-draft test on 2026-09-01 ran ten minutes, cost $3.60,
      # created no branch, no pull request and no issue, and the job went
      # green. Three separate layers allowed that: the action's own
      # is_error only means the agent did not crash, the job description
      # had no instruction for "I am blocked", and nothing checked that
      # anything came out. This step is the third layer, and it is the
      # only one that can actually enforce it.
      #
      # Exactly one of three things must exist, created by THIS run:
      #   a pull request from a post/ branch   (it wrote a post)
      #   an issue labeled content-skipped     (no topic worth writing)
      #   an issue labeled content-blocked     (it could not finish, and said so)
      # Anything else, including hitting --max-turns, fails the job.
      #
      # if: always() so it also runs when the agent step itself failed:
      # a crash with no explanation filed still deserves a clear message
      # rather than a bare red X.
      - name: Something must have come out of this
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          SINCE: ${{ steps.start.outputs.at }}
        run: |
          set -euo pipefail
          echo "Looking for anything created since $SINCE"

          PR=$(gh pr list --state open --json number,headRefName,createdAt \
               | jq -r --arg since "$SINCE" \
                 '[.[] | select(.headRefName | startswith("post/"))
                       | select(.createdAt >= $since)] | .[0].number // empty')

          ISSUE=$(gh issue list --state all --limit 30 --json number,createdAt,labels \
                  | jq -r --arg since "$SINCE" \
                    '[.[] | select(.createdAt >= $since)
                          | select([.labels[].name] | any(. == "content-skipped" or . == "content-blocked"))]
                     | .[0].number // empty')

          if [ -n "$PR" ]; then
            echo "Pull request #$PR. The write path ran."
            exit 0
          fi
          if [ -n "$ISSUE" ]; then
            echo "Issue #$ISSUE. The agent said why there is no post."
            exit 0
          fi

          echo "::error title=The Content Writer produced nothing::No pull request from a post/ branch, and no content-skipped or content-blocked issue. Either the agent stopped without saying why, or it hit the 60-turn cap mid-task. Read the full agent output in the step above: show_full_output is on, so the refused commands and its last message are in this log. Do not treat this as a quiet week."
          exit 1
