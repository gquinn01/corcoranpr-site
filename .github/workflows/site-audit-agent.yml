name: "Agent: Site Auditor (weekly)"

on:
  schedule:
    - cron: "0 12 * * 1"   # Every Monday, 12:00 UTC (8:00am ET)
  workflow_dispatch: {}     # Adds a manual "Run workflow" button so you can test anytime

permissions:
  contents: read            # The agent can read the site files...
  issues: write             # ...and file/comment on Issues. Nothing else.
  id-token: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      # With no SITE_URL set, the scan covers EVERY page under docs/ and
      # scores each one separately. Set the SITE_URL repo variable to audit
      # a live site instead (its page list comes from its own sitemap.xml),
      # which is also how you audit a prospect's site.
      - name: Run the SEO scan
        run: |
          if [ -n "${{ vars.SITE_URL }}" ]; then
            python3 scripts/audit.py "${{ vars.SITE_URL }}"
          else
            python3 scripts/audit.py
          fi

      - name: Claude interprets the scan and files the report
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            Read the file agents/site-auditor.md and follow those instructions
            exactly. Today's scan results are in audit-report.md.
          claude_args: |
            --allowedTools "Read,Grep,Glob,Bash(gh issue:*),Bash(gh label:*),Bash(date:*)"
        env:
          GH_TOKEN: ${{ github.token }}
