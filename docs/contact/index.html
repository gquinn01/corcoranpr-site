<!DOCTYPE html>
<html lang="en">
<head>
  <!-- ============================================================
       REDIRECT STUB for the old WordPress URL /contact/.
       Built 2026-08-27 from the pre-cutover redirect map. The old site
       had 28 indexable URLs; 15 of them have a page here that genuinely
       answers what they answered, and each of those 15 is a file like
       this one. The rest 404 on purpose, because a redirect that lies
       about relevance is worse than an honest 404.

       GitHub Pages cannot issue a real 301, and .nojekyll rules out the
       redirect plugin, so this is a meta refresh plus a rel=canonical.
       Three layers, so nothing is needed for it to work:
         1. rel=canonical  tells crawlers where the content lives
         2. meta refresh   moves a browser with no JavaScript
         3. location.replace  moves it faster, without a history entry
         4. a real link    for anyone none of the above reached

       THE CANONICAL CARRIES NO FRAGMENT even when the refresh target
       does. Google strips fragments from canonicals, so pointing one at
       /page/#anchor just means /page/ with extra characters. The reader
       still lands on the anchor; the crawler is told the page.

       NO STYLESHEET, NO SCRIPT, NO ANALYTICS. This file exists for
       crawlers and for the half second before a browser leaves it.
       Loading the site stylesheet to style a line nobody reads would
       cost a request on every redirected hit.

       NOT IN sitemap.xml AND NOT IN llms.txt, deliberately. A stub is
       not a page. scripts/audit.py reads the corcoran-page marker below
       and scores this file against a four-check rubric of its own.
       ============================================================ -->
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="corcoran-page" content="redirect-stub">
  <title>Page Moved | Corcoran Communications</title>
  <link rel="canonical" href="https://corcoranpr.com/free-audit/">
  <meta http-equiv="refresh" content="0; url=../free-audit/">
  <script>location.replace("../free-audit/");</script>
</head>
<body>
  <p>This page moved. Continue to <a href="../free-audit/">Free AI Site Audit</a>.</p>
</body>
</html>
